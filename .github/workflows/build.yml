name: Build DynamicWinds

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build mod jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build
        run: |
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Commit build log on failure
        if: failure()
        run: |
          git config user.name "ci"
          git config user.email "ci@local"
          git add -f build.log || true
          git commit -m "ci: build log" || true
          git push || true

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload jar
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dynamicwinds-jar
          path: build/libs/*.jar
          if-no-files-found: warn
