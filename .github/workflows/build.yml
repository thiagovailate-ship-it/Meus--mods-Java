name: Build DynamicWinds

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build mod jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Build
        run: |
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Commit build log on failure
        if: failure()
        run: |
          git config user.name "ci"
          git config user.email "ci@local"
          head -120 build.log > build_head.log
          git add -f build_head.log
          git commit -m "ci: build head log" || true
          git push origin HEAD:arena/696b4eb5-meus-mods-java || true

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload jar
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dynamicwinds-jar
          path: build/libs/*.jar
          if-no-files-found: warn
