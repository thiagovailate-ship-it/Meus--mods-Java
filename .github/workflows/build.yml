name: Build DynamicWinds

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build mod jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify generated assets and Java/Python mirror parity
        run: |
          python3 tools/check_mirror.py
          python3 tools/check_seams.py
          python3 tools/preview_storm.py --check
          python3 tools/test_check_field.py

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Build
        run: |
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      # Publica o inicio do log de build na propria branch que falhou. Antes
      # isso empurrava para uma branch fixa de outra sessao: como o commit de
      # log nao e descendente daquela branch, o push era rejeitado
      # (non-fast-forward) e o log nunca chegava ao repositorio.
      - name: Commit build log on failure
        if: failure() && github.ref_type == 'branch'
        run: |
          git config user.name "ci"
          git config user.email "ci@local"
          head -400 build.log > build_head.log
          git add -f build_head.log
          git commit -m "ci: build head log [skip ci]" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload jar
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dynamicwinds-jar
          path: build/libs/*.jar
          if-no-files-found: warn
